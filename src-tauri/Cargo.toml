[package]
name = "prime-agent-studio"
version = "2.8.0"
description = "Prime Agent Studio desktop application"
authors = ["zerr0o"]
edition = "2021"
license = "MIT"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon"] }
tauri-plugin-single-instance = "2"
tauri-plugin-autostart = "2"
tauri-plugin-opener = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rfd = "0.15"
sys-locale = "0.3"
tauri-plugin-updater = "2"
tokio = { version = "1.53.1", features = ["time"] }

[profile.release]
strip = true
lto = true
codegen-units = 1

[dev-dependencies]
tauri = { version = "2", features = ["test"] }
